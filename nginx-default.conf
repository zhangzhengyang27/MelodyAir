server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 须配在容器层（VPS 全局 gzip 默认关闭）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # hash 指纹资源长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # history 路由回退：先精确文件，再目录，最后回 index.html（三级缺一不可）
    # index.html 用 no-cache（每次协商缓存/ETag 重验证），保证刷新必得新版；
    # hash 指纹资源在 /assets/ 段用长缓存，两者配合
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
